# Copies products, prices and contact details from Iraqi vendors' websites and pages every day.
# The new catalog is committed to main; Netlify then republishes the website, and the phone apps
# download it the next time they open. Sources are listed in scripts/sync/sources.json.
name: Daily catalog sync

on:
  schedule:
    - cron: '17 0 * * *' # every day at 03:17 Iraq time (00:17 UTC): products, prices and the dollar rate
    - cron: '30 8 * * *' # 11:30 Iraq time, after the morning market report: the dollar rate only
    - cron: '0 12 * * *' # 15:00 Iraq time: the dollar rate only
  workflow_dispatch: {} # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the importers
        run: python -m unittest discover -s scripts/sync

      - name: Import every source
        env:
          # Optional, only for Instagram sources (see scripts/sync/README.md)
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        # The 11:30 and 15:00 runs pass "rate", which matches no vendor, so every vendor keeps its data and only the rate updates
        run: python scripts/sync/sync.py ${{ (github.event.schedule == '30 8 * * *' || github.event.schedule == '0 12 * * *') && 'rate' || '' }}

      - name: Save the new catalog
        run: |
          if git diff --quiet -- public/catalog.json scripts/sync/last-report.json; then
            echo "Nothing changed today."
            exit 0
          fi
          git config user.name "printingiq-sync[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/catalog.json scripts/sync/last-report.json
          git commit -m "Daily catalog sync $(date -u +'%F %H:%M') UTC"
          git push
